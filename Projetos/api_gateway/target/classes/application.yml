server:
  port: 8080

spring:
  cloud:
    gateway:
      server:
        webflux:
          routes:

            - id: restricao-service
              uri: ${RESTRICAO_URL:http://localhost:8082}
              predicates:
                - Path=/restricao/**

            - id: cliente-service
              uri: ${CLIENTE_URL:http://localhost:8081}
              predicates:
                - Path=/cliente/**